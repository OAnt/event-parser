x-common-env: &common-env
  MONGO_INITDB_ROOT_USERNAME: se://MONGO_USERNAME
  MONGO_INITDB_ROOT_PASSWORD: se://MONGO_PASSWORD

x-worker-env: &worker-env
  <<: *common-env
  MODEL: data/models/bartowski/mistralai_Ministral-3-3B-Instruct-2512-Q8_0.gguf
  MMPROJ: data/models/bartowski/mmproj-mistralai_Ministral-3-3B-Instruct-2512-bf16.gguf
  EVP_CELERY_BROKER: redis:6379/0
  EVP_CELERY_BACKEND: redis:6379/1
  INSTA_ID: se://INSTA_ID
  FB_APP_ID: se://FB_APP_ID
  FB_APP_SECRET: se://FB_APP_SECRET
  FB_TOKEN: se://FB_TOKEN
  MONGO_PORT: 27017
  MONGO_HOST: mongo

x-worker-common: &worker-common
  build:
    dockerfile: dockerfiles/worker/Dockerfile
    context: .
    args:
      ROCM_ARCH: gfx1010
      POETRY_ARGS: "--with dev"
      UID: 1000
      GID: 1000 
  networks:
    - event-parser
  volumes:
    - ./data/images:/app/data/images
    - ./data/models:/app/data/models
    - ./evp:/app/evp/

networks:
  event-parser: {}

services:
  redis:
    image: redis:8.10
    ports:
      - 127.0.0.1:6379:6379
    networks:
      - event-parser
  mongo:
    image: mongo
    environment:
       <<: *common-env
    volumes:
      - ./data/mongo:/data/db/
    ports:
      - 127.0.0.1:27017:27017
    networks:
      - event-parser
  worker:
    <<: *worker-common
    environment:
      <<: *worker-env
      EVP_CELERY_PRIMARY: 1
    command: ["watchfiles", "--filter", "python", "celery -A evp.workers worker -l INFO -P solo -Q generic", "/app"]
  worker-llm:
    <<: *worker-common
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    security_opt:
      - "seccomp=unconfined"
    environment:
      <<: *worker-env
    command: ["watchfiles", "--filter", "python", "celery -A evp.workers worker -l INFO -P solo -Q llama", "/app"]


